[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-manager"
version = "0.2.0"
description = "Tech management laboratory project"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tech-manager = "tech_manager.main:main"
tech-manager-benchmark = "tech_manager.benchmark:main"
