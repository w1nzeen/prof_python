[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "equipment-manager"
version = "0.8.0"
description = "Computer equipment accounting laboratory project with REST API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
]

[project.scripts]
equipment-manager = "equipment_manager.main:main"
equipment-importer = "equipment_manager.importer.main:main"

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: integration tests (several components, real temporary files)",
]

[tool.coverage.run]
branch = true
source = ["equipment_manager"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
]

[tool.setuptools.package-data]
equipment_manager = ["py.typed"]

[tool.mypy]
mypy_path = "src"
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true