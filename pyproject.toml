[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "equipment-manager"
version = "0.2.0"
description = "Computer equipment accounting laboratory project"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
equipment-manager = "equipment_manager.main:main"

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
